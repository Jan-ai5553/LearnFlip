<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LearnFlip</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
}

header{
    background:#4CAF50;
    color:white;
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:25px auto;
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#43a047;
}

.karte{
    margin-top:25px;
    background:white;
    border-radius:20px;
    padding:40px;
    min-height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:24px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    cursor:pointer;
}
</style>

</head>
<body>

<header>
📚 LearnFlip
</header>

<div class="container">

<input id="frage" placeholder="Frage eingeben">

<input id="antwort" placeholder="Antwort eingeben">

<button onclick="karteSpeichern()">Karte speichern</button>

<div id="karten"></div>

</div>

<script>

function karteSpeichern(){

const frage=document.getElementById("frage").value;
const antwort=document.getElementById("antwort").value;

if(frage===""||antwort===""){
alert("Bitte Frage und Antwort eingeben.");
return;
}

const karte=document.createElement("div");
karte.className="karte";
karte.innerHTML=frage;

let vorne=true;

karte.onclick=function(){

if(vorne){
karte.innerHTML=antwort;
}else{
karte.innerHTML=frage;
}

vorne=!vorne;

};

document.getElementById("karten").prepend(karte);

document.getElementById("frage").value="";
document.getElementById("antwort").value="";

}

</script>

</body>
</html>
